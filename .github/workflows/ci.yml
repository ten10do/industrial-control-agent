name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: industrial_control_agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d industrial_control_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install quality tools
        run: python -m pip install ruff pytest-cov pip-audit

      - name: Ruff lint
        run: python -m ruff check backend || true

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://agent:test-password@localhost:5432/industrial_control_agent
          DATABASE_SSLMODE: disable
        run: python -m alembic upgrade head

      - name: Run backend tests with coverage
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://agent:test-password@localhost:5432/industrial_control_agent
        run: python -m pytest backend/tests -v --cov=backend --cov-report=term --cov-fail-under=70

      - name: Dependency audit
        run: python -m pip_audit -r backend/requirements.txt || true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install ESLint
        working-directory: frontend
        run: npm install --no-save eslint @eslint/js globals

      - name: Run ESLint
        working-directory: frontend
        run: npx eslint src/ --max-warnings 5 || true

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://industrial-control-agent-backend.onrender.com
        run: npm run build

  smoke:
    name: Post-Deploy Smoke Test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Smoke test backend
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://industrial-control-agent-backend.onrender.com/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying..."
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

      - name: Smoke test frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://industrial-control-agent.netlify.app || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Frontend healthy"
          else
            echo "Frontend returned HTTP $STATUS"
            exit 1
          fi
